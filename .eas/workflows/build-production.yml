name: Production Build & Submit
on:
  push:
    branches: ['main']

jobs:
  lint_and_typecheck:
    name: Lint & Type Check
    type: install
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Type check
        run: npx tsc --noEmit || true
      - name: Lint check
        run: npx expo lint || true

  build_ios:
    name: Build iOS Production
    needs: [lint_and_typecheck]
    type: build
    platform: ios
    profile: production

  submit_ios:
    name: Submit to App Store
    needs: [build_ios]
    type: submit
    platform: ios
    profile: production
